<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio — Document management</title><style>body{font:16px system-ui;background:#111820;color:#f4f5f5;margin:0;padding:40px 20px}main{max-width:740px;margin:auto}h1{font-size:28px}input,button{font:inherit;padding:12px;border-radius:6px}input[type=password]{width:min(95%,400px)}button{cursor:pointer;background:#e9a24e;color:#111;border:0;margin:5px}li{padding:12px;border-bottom:1px solid #555;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}p{line-height:1.5}a{color:#f5b86b}</style></head><body><main><p><a href="/">← Back to portfolio</a></p><h1>Document management</h1><p>Private administrative controls. Uploaded documents become public immediately. Do not publish confidential records or personal data.</p><label>Administrator password<br><input id="password" type="password" autocomplete="off" placeholder="Enter administrator password"></label><p><label>Choose files (PDF, JPG, PNG, DOCX, XLSX, TXT; maximum 3 MB each)<br><input id="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.docx,.xlsx,.txt"></label></p><button id="upload">Publish selected documents</button><button id="refresh">Refresh list</button><p id="status" role="status"></p><h2>Published documents</h2><ul id="list"></ul></main><script>
const api='/.netlify/functions/documents',status=document.getElementById('status'),list=document.getElementById('list');const allowed={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',txt:'text/plain'};function password(){return document.getElementById('password').value}async function refresh(){try{const r=await fetch(api);if(!r.ok)throw Error('List unavailable');const j=await r.json();list.replaceChildren();for(const d of j.documents){const li=document.createElement('li'),label=document.createElement('span'),link=document.createElement('a'),del=document.createElement('button');label.textContent=d.name+' ('+(d.size/1048576).toFixed(2)+' MB)';link.href=api+'?id='+encodeURIComponent(d.id);link.textContent='Download';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete '+d.name+' from public archive?'))return;const r=await fetch(api,{method:'DELETE',headers:{'Content-Type':'application/json','x-admin-password':password()},body:JSON.stringify({id:d.id})});status.textContent=r.ok?'Deleted':'Delete failed: '+(await r.json()).error;refresh()};li.append(label,link,del);list.append(li)}if(!j.documents.length)list.textContent='No published documents.'}catch(e){status.textContent=e.message}}document.getElementById('refresh').onclick=refresh;
document.getElementById('upload').onclick=async()=>{const files=[...document.getElementById('files').files];if(!password()){status.textContent='Enter your password first';return}if(!files.length){status.textContent='Select files first';return}for(const f of files){if(f.size>3*1024*1024){status.textContent=f.name+': exceeds 3 MB';continue}const ext=f.name.split('.').pop().toLowerCase();if(!allowed[ext]){status.textContent=f.name+': unsupported format';continue}status.textContent='Uploading '+f.name+'…';try{const data=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(String(rd.result).split(',')[1]);rd.onerror=rej;rd.readAsDataURL(f)});const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':password()},body:JSON.stringify({name:f.name,type:allowed[ext],data})});const j=await r.json();status.textContent=r.ok?f.name+' published':f.name+': '+j.error;if(!r.ok)break}catch(e){status.textContent='Upload failed: '+e.message;break}}refresh()};refresh();
</script></body></html>
